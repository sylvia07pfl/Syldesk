{% extends "auth/auth_base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-logo">
  <div class="logo-badge">🌸</div>
  <h1>Syl<span>desk</span></h1>
  <p>Your private career operating system</p>
</div>
<div class="auth-card">
  <h2>Welcome back 🌷</h2>
  <p class="auth-subtitle">Sign in to continue your journey</p>
  <form method="POST" action="{{ url_for('auth.login') }}">
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input class="form-control" type="email" id="email" name="email"
             placeholder="you@example.com" required autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password"
             placeholder="••••••••" required autocomplete="current-password">
    </div>
    <div class="form-check" style="margin-bottom:18px">
      <input type="checkbox" id="remember" name="remember">
      <label for="remember">Remember me</label>
    </div>
    <button type="submit" class="btn-auth">Sign In ✨</button>
  </form>
  <div class="auth-switch">
    Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign up</a>
  </div>
</div>
{% endblock %}
