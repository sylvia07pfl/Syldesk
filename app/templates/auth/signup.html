{% extends "auth/auth_base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="auth-logo">
  <div class="logo-badge">🌸</div>
  <h1>Syl<span>desk</span></h1>
  <p>Build your career, beautifully</p>
</div>
<div class="auth-card">
  <h2>Create your account 🌸</h2>
  <p class="auth-subtitle">Start organizing your career journey today</p>
  <form method="POST" action="{{ url_for('auth.signup') }}">
    <div class="form-group">
      <label class="form-label" for="name">Full Name</label>
      <input class="form-control" type="text" id="name" name="name"
             placeholder="Your name" required autocomplete="name">
    </div>
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input class="form-control" type="email" id="email" name="email"
             placeholder="you@example.com" required autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password"
             placeholder="At least 6 characters" required autocomplete="new-password">
    </div>
    <div class="form-group">
      <label class="form-label" for="confirm_password">Confirm Password</label>
      <input class="form-control" type="password" id="confirm_password" name="confirm_password"
             placeholder="Repeat your password" required autocomplete="new-password">
    </div>
    <button type="submit" class="btn-auth">Create Account 🚀</button>
  </form>
  <div class="auth-switch">
    Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
  </div>
</div>
{% endblock %}
